<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            outline: none;
            background: #e8d5f0;
        }

        #ball {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                #c471ed, #8e2de2, #4a00e0, #1a0033);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }

        button {
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            background: #e8d5f0;
            color: #4a00e0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <script src="Lr7.js"></script>>
</body>
</html>
